<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBangku</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <div class="logo">
            🪑
        </div>

        <h1>SMARTBANGKU</h1>

        <p class="subtitle">
            Duduk selesa, barang lebih terjaga! ✨
        </p>

        <div class="card">

            <h2>Selamat Datang 👋</h2>

            <p>
                Sila masukkan nombor telefon anda untuk memulakan sesi.
            </p>

            <input
                type="tel"
                id="phoneNumber"
                placeholder="Contoh: 0123456789"
            >

            <button onclick="startSession()">
                🚀 MULA
            </button>

        </div>

        <p class="footer">
            SmartBangku • IPGKPT
        </p>

    </div>

   <script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js")
        .then(() => {
            console.log("SmartBangku Service Worker berjaya didaftarkan.");
        })
        .catch(error => {
            console.log("Service Worker gagal:", error);
        });
}
</script>

</body>
</html>
